      <feTurbulence type="fractalNoise" baseFrequency="0.12 0.5" numOctaves="2" seed="7" result="n"/>

    </filter>
    <symbol id="i-stroke" viewBox="0 0 240 36" preserveAspectRatio="none">
      <g filter="url(#f-rough)" fill="none" stroke="#E9C45C" stroke-linecap="round">

        <path d="M14 22 Q 80 16 150 19 T 228 20" stroke-width="12" opacity=".6"/>
      </g>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 32 20">
      <path d="M2.5 10.4 Q 14 9.2 28.5 9.9 M 22.5 4.2 Q 26.5 7.6 29.5 9.9 Q 26 12.4 22.8 15.6"

      <circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 2.6 L12 4.8"/><path d="M12 19.2 L12 21.4"/>

      <circle cx="20" cy="10.2" r=".6" fill="currentColor"/>

<main class="play-main container" id="main">
  <div class="play-head">
    <h1>Fox Run <svg class="stroke" aria-hidden="true"><use href="#i-stroke"/></svg></h1>
    <p class="meta">Game Boy Color · 内嵌模拟器 · 按回车键开始</p>
  </div>

  <div class="stage-wrap">
    <div class="stage gbc">
      <iframe id="game-frame" data-game="gbc"
              src="../../games/gbc/index.html?lang=zh"

              allow="fullscreen; autoplay"
              allowfullscreen></iframe>
      <div class="stage-loading" id="stage-loading">
        <div class="inner">
          <img src="../assets/chicken.png" alt="">
          <p class="msg">正在装上卡带<span class="loading-dots"></span></p>
        </div>
      </div>
    </div>
  </div>

  <div class="play-tips">
    <ul class="controls-list">
      <li><kbd>Enter</kbd> 开始</li>
      <li><kbd>↑</kbd> 跳跃</li>
      <li><kbd>S</kbd> 张嘴</li>
      <li><kbd>←</kbd><kbd>→</kbd> 移动</li>
    </ul>
    <p class="hint">若键盘没有反应，点一下游戏画面即可。也可以<a href="../../games/gbc/index.html?lang=zh" target="_blank" rel="noopener">在新标签页打开原始页面</a>。</p>
  </div>
</main>
